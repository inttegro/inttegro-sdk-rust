[package]
name = "inttegro"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Official server-side Rust SDK for Inttegro"
license = "MIT"
repository = "https://github.com/inttegro/inttegro-sdk-rust"
homepage = "https://studio.inttegro.com/sdks/rust"
documentation = "https://docs.rs/inttegro"
keywords = ["payments", "commerce", "inttegro"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
url = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
